name: commit to dc channel
on:
  push:
  workflow_dispatch:

jobs:
  fuck-to-discord:
    runs-on: ubuntu-22.04
    steps:
     - uses: actions/checkout@v3
     
     - name: Discord Commit Message Webhook
       uses: tristanbudd/discord-commit-github-action@1.0.1
       with:
         webhook-url: ${{ secrets.WEBHOOK_URL }}
